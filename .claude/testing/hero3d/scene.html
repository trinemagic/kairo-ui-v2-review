<script type="module">
import * as THREE from 'three';

const P=new URLSearchParams(location.search);

const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
r.setPixelRatio(1);r.setSize(W,H);r.outputColorSpace=THREE.SRGBColorSpace;r.toneMapping=THREE.NeutralToneMapping;r.toneMappingExposure=1.0;
r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;document.body.appendChild(r.domElement);
const scene=new THREE.Scene();
const pm=new THREE.PMREMGenerator(r);scene.environment=pm.fromScene(new RoomEnvironment(),0.04).texture;scene.environmentIntensity=0.45;
const tl=new THREE.TextureLoader();

function canvasTex(w,h,draw,repeat){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=16;if(repeat){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(...repeat)}return t}
// meja kayu (warna dari keluarga emas palet Kairo: #dfa94a -> #7a5410), papan memanjang kiri-kanan
const rnd=(()=>{let x=7;return()=>(x=(x*16807)%2147483647)/2147483647})();

function woodDraw(x,w,h,rough){
  for(let p=0;p<h/plankH;p++){const y0=p*plankH,tone=rnd()*.18-.09;
    const g=x.createLinearGradient(0,y0,0,y0+plankH);const base=rough?[128,128,128]:[0x6e+tone*70,0x4a+tone*50,0x1c+tone*22];
    g.addColorStop(0,`rgb(${base.map(v=>v*.92|0)})`);g.addColorStop(.5,`rgb(${base.map(v=>v|0)})`);g.addColorStop(1,`rgb(${base.map(v=>v*.9|0)})`);x.fillStyle=g;x.fillRect(0,y0,w,plankH);
    for(let i=0;i<260;i++){const yy=y0+rnd()*plankH,amp=3+rnd()*10,fq=.0008+rnd()*.0025,ph=rnd()*9;x.beginPath();
      for(let X=0;X<=w;X+=8){const Y=yy+Math.sin(X*fq+ph)*amp+Math.sin(X*fq*3.1+ph)*amp*.3;X?x.lineTo(X,Y):x.moveTo(X,Y)}
      x.strokeStyle=rough?`rgba(${rnd()<.5?255:0},${rnd()<.5?255:0},${rnd()<.5?255:0},${.03+rnd()*.05})`:`rgba(${rnd()<.6?'45,26,6':'223,169,74'},${.025+rnd()*.06})`;x.lineWidth=.5+rnd()*1.3;x.stroke()}
    for(let k=0;k<(rnd()<.35?1:0);k++){const kx=rnd()*w,ky=y0+plankH*(.3+rnd()*.4);for(let r=18;r>2;r-=2.5){x.beginPath();x.ellipse(kx,ky,r*2.4,r,0,0,7);x.strokeStyle=rough?'rgba(0,0,0,.08)':'rgba(55,32,8,.18)';x.lineWidth=1.2;x.stroke()}}
    x.fillStyle=rough?'rgba(0,0,0,.35)':'rgba(30,18,4,.7)';x.fillRect(0,y0+plankH-3,w,3);}
}
const deskTex=canvasTex(4096,2048,(x,w,h)=>woodDraw(x,w,h,false),[1,1]);

const floor=new THREE.Mesh(new THREE.PlaneGeometry(900,900),new THREE.MeshStandardMaterial({map:floorTex,roughness:.92}));floor.rotation.x=-Math.PI/2;floor.position.y=-TH-LEG;floor.receiveShadow=true;scene.add(floor);

const wall=new THREE.Mesh(new THREE.PlaneGeometry(700,320),new THREE.MeshStandardMaterial({map:wallTex,roughness:.95}));wall.position.set(0,-TH-LEG+160,-DD/2-34);wall.receiveShadow=true;scene.add(wall);

// pigura: bingkai kayu tipis, passe-partout putih tulang, karya abstrak palet Kairo (lingkaran emas, busur toska, garis delft)
const artTex=canvasTex(800,1000,(x,w,h)=>{x.fillStyle='#fbfcf8';x.fillRect(0,0,w,h);x.fillStyle='#dceff4';x.fillRect(90,90,w-180,h-180);
  x.fillStyle='#dfa94a';x.beginPath();x.arc(w*.6,h*.38,120,0,7);x.fill();
  x.strokeStyle='#25b9b0';x.lineWidth=46;x.beginPath();x.arc(w*.42,h*.66,150,Math.PI*1.05,Math.PI*1.95);x.stroke();
  x.fillStyle='#173a59';x.fillRect(150,h-230,w-300,18);});
const art=new THREE.Group();scene.add(art);
const frame=new THREE.Mesh(new THREE.BoxGeometry(34,42,1.6),new THREE.MeshStandardMaterial({color:'#5a3a12',roughness:.5}));frame.castShadow=true;art.add(frame);
const canvasArt=new THREE.Mesh(new THREE.PlaneGeometry(31,39),new THREE.MeshStandardMaterial({map:artTex,roughness:.85}));canvasArt.position.z=.82;art.add(canvasArt);
art.position.set(-6,38,WZ+.9);art.scale.setScalar(.72);
// buku catatan (sampul delft, karet emas) + pulpen di atasnya = 2 item, sejajar rapi di kiri laptop
const book=new THREE.Group();scene.add(book);
const cover=new THREE.Mesh(new RoundedBoxGeometry(15,1.1,21,3,.25),new THREE.MeshPhysicalMaterial({color:'#31556f',roughness:.55,sheen:.3}));cover.position.y=.55;cover.castShadow=cover.receiveShadow=true;book.add(cover);
const pages=new THREE.Mesh(new THREE.BoxGeometry(14.6,.8,20.4),new THREE.MeshStandardMaterial({color:'#f3efe4',roughness:.9}));pages.position.set(.25,.55,0);book.add(pages);
const band=new THREE.Mesh(new THREE.BoxGeometry(.6,1.16,21.05),new THREE.MeshStandardMaterial({color:'#dfa94a',roughness:.5}));band.position.set(5.6,.55,0);book.add(band);
book.position.set(-24,0,2);
const pen=new THREE.Group();scene.add(pen);
const penMat=new THREE.MeshPhysicalMaterial({color:'#173a59',metalness:.3,roughness:.25,clearcoat:.8});
const penBody=new THREE.Mesh(new THREE.CylinderGeometry(.5,.45,13.5,24),penMat);penBody.rotation.x=Math.PI/2;pen.add(penBody);
const penTip=new THREE.Mesh(new THREE.ConeGeometry(.45,1.4,24),new THREE.MeshStandardMaterial({color:'#c9cdd1',metalness:1,roughness:.25}));penTip.rotation.x=-Math.PI/2;penTip.position.z=-7.4;pen.add(penTip);
const clip=new THREE.Mesh(new RoundedBoxGeometry(.32,.25,5,2,.1),new THREE.MeshStandardMaterial({color:'#25b9b0',metalness:.6,roughness:.3}));clip.position.set(0,.55,4.2);pen.add(clip);
pen.traverse(m=>{m.castShadow=true});pen.position.set(-25.5,1.62,2);pen.rotation.y=0;
// laptop
const alu=new THREE.MeshPhysicalMaterial({color:'#d9dde1',metalness:1,roughness:.24,clearcoat:.4,clearcoatRoughness:.25,envMapIntensity:1.6});
const laptop=new THREE.Group();scene.add(laptop);
const LW=31.2,LD=22,BH=1.1;
const base=new THREE.Mesh(new RoundedBoxGeometry(LW,BH,LD,6,0.55),alu);base.position.y=BH/2;base.castShadow=base.receiveShadow=true;laptop.add(base);
const deck=new THREE.Mesh(new THREE.PlaneGeometry(26.4,10.6),new THREE.MeshStandardMaterial({color:'#2b333a',roughness:.55,envMapIntensity:.8}));deck.rotation.x=-Math.PI/2;deck.position.set(0,BH+0.002,-3.6);laptop.add(deck);
const keyGeo=new RoundedBoxGeometry(1.62,0.18,1.55,3,0.18),keyMat=new THREE.MeshStandardMaterial({color:'#262d33',roughness:.45,envMapIntensity:1.2});
const rows=[14,14,13,12,11],keys=new THREE.InstancedMesh(keyGeo,keyMat,80);let k=0;const m4=new THREE.Matrix4();
rows.forEach((n,ri)=>{const pitch=1.86,start=-(n-1)*pitch/2;for(let i=0;i<n;i++){m4.makeTranslation(start+i*pitch,BH+0.1,-7.9+ri*1.86);keys.setMatrixAt(k++,m4)}});
const space=new THREE.Mesh(new RoundedBoxGeometry(9.4,0.18,1.55,3,0.18),keyMat);space.position.set(0,BH+0.1,-7.9+5*1.86);laptop.add(space);
keys.count=k;keys.castShadow=true;laptop.add(keys);
const pad=new THREE.Mesh(new RoundedBoxGeometry(12.5,0.05,7.6,3,0.5),new THREE.MeshPhysicalMaterial({color:'#cfd4d8',metalness:.9,roughness:.3,envMapIntensity:1.4}));pad.position.set(0,BH+0.01,6.2);laptop.add(pad);
// layar (engsel di belakang, terbuka ~108 derajat)
const lid=new THREE.Group();lid.position.set(0,BH,-LD/2+0.3);lid.rotation.x=-(108-90)*Math.PI/180;laptop.add(lid);
const lidBody=new THREE.Mesh(new RoundedBoxGeometry(LW,21.2,0.55,6,0.27),alu);lidBody.position.set(0,10.6,-0.27);lidBody.castShadow=true;lid.add(lidBody);
const bezel=new THREE.Mesh(new RoundedBoxGeometry(LW-0.4,20.8,0.05,4,0.6),new THREE.MeshStandardMaterial({color:'#0a0d10',roughness:.25,metalness:.2}));bezel.position.set(0,10.6,0.02);lid.add(bezel);
const scr=await tex('hero-laptop.webp');
const SW=28.4,SH=SW*800/1280;
const screen=new THREE.Mesh(new THREE.PlaneGeometry(SW,SH),new THREE.MeshBasicMaterial({map:scr,toneMapped:false}));screen.position.set(0,10.9,0.06);lid.add(screen);
const glare=new THREE.Mesh(new THREE.PlaneGeometry(SW,SH),new THREE.MeshPhysicalMaterial({color:'#ffffff',transparent:true,opacity:.03,roughness:.05,metalness:0}));glare.position.set(0,10.9,0.07);lid.add(glare);
laptop.position.set(4,0,-8);
// HP di meja, di samping laptop
const phone=new THREE.Group();scene.add(phone);
const PW=7.4,PL=15.6;
const pbody=new THREE.Mesh(new RoundedBoxGeometry(PW,0.8,PL,8,0.9),new THREE.MeshPhysicalMaterial({color:'#082f3b',metalness:.85,roughness:.3,clearcoat:.6}));pbody.position.y=0.4;pbody.castShadow=true;phone.add(pbody);
const pglass=new THREE.Mesh(new RoundedBoxGeometry(PW-0.2,0.02,PL-0.2,6,0.8),new THREE.MeshStandardMaterial({color:'#05080a',roughness:.15}));pglass.position.y=0.81;phone.add(pglass);
const ps=await tex('hero-phone.webp');const PSW=PW-0.75,PSH=PSW*1125/520;
const pscreen=new THREE.Mesh(new THREE.PlaneGeometry(PSW,Math.min(PSH,PL-0.75)),new THREE.MeshBasicMaterial({map:ps,toneMapped:false}));pscreen.rotation.x=-Math.PI/2;pscreen.position.y=0.83;phone.add(pscreen);
const HOLD_A=1.22;// kemiringan HP (~70 derajat dari meja)
phone.rotation.x=HOLD_A;phone.position.set(30,1.4+(PL/2)*Math.sin(HOLD_A)*.98+.3,-2);
const holdMat=new THREE.MeshPhysicalMaterial({color:'#31556f',metalness:.6,roughness:.35,clearcoat:.4});
const holder=new THREE.Group();scene.add(holder);
const hBase=new THREE.Mesh(new RoundedBoxGeometry(8.6,1.2,8,3,.4),holdMat);hBase.position.y=.6;hBase.castShadow=hBase.receiveShadow=true;holder.add(hBase);
const hBack=new THREE.Mesh(new RoundedBoxGeometry(6.4,11,0.7,3,.3),holdMat);hBack.rotation.x=HOLD_A-Math.PI/2;hBack.position.set(0,6,-3.2);hBack.castShadow=true;holder.add(hBack);
const hLip=new THREE.Mesh(new RoundedBoxGeometry(8.6,1.6,1,3,.3),holdMat);hLip.position.set(0,1.8,3.1);hLip.castShadow=true;holder.add(hLip);
holder.position.set(30,0,-2+Math.cos(HOLD_A)*PL/2-1.6);
// lampu berdiri (lantai -> setinggi laptop), kap kain putih tulang, cahaya hangat
const lamp=new THREE.Group();scene.add(lamp);
const LMx=-53,LMz=-24,LTOP=21;
const lMetal=new THREE.MeshPhysicalMaterial({color:'#173a59',metalness:.7,roughness:.3,clearcoat:.5});
const lBase=new THREE.Mesh(new THREE.CylinderGeometry(8,9,1.8,48),lMetal);lBase.position.y=FY+1.1;lBase.castShadow=lBase.receiveShadow=true;lamp.add(lBase);
const poleH=LTOP-13-FY;const pole=new THREE.Mesh(new THREE.CylinderGeometry(.6,.6,poleH,24),lMetal);pole.position.y=FY+poleH/2;pole.castShadow=true;lamp.add(pole);
const shade=new THREE.Mesh(new THREE.CylinderGeometry(7,9.5,13,48,1,true),new THREE.MeshStandardMaterial({color:'#fbfcf8',emissive:'#ffcf8a',emissiveIntensity:.55,roughness:.9,side:THREE.DoubleSide,transparent:true,opacity:.97}));shade.position.y=LTOP-6.5;lamp.add(shade);
const bulb=new THREE.PointLight('#ffc77a',1800,0,2);bulb.position.y=LTOP-7;bulb.castShadow=false;lamp.add(bulb);
lamp.position.set(LMx,0,LMz);
// lampu: matahari sore dari jendela kiri-belakang, isian langit sejuk
const sun=new THREE.DirectionalLight('#ffe2b8',3.2);sun.position.set(-120,110,60);sun.castShadow=true;sun.shadow.mapSize.set(4096,4096);sun.shadow.radius=6;sun.shadow.blurSamples=20;sun.shadow.bias=-0.0003;sun.shadow.normalBias=.05;Object.assign(sun.shadow.camera,{left:-140,right:140,top:140,bottom:-140,near:1,far:500});scene.add(sun);
scene.add(new THREE.HemisphereLight('#cfe4ff','#4a3010',0.55));

if(variant==='wide'){// geser lensa: skala SAMA di dua arah (kalau beda, gambar melebar)
const K=1.5;cam.position.set(12,60,150);cam.lookAt(8,-10,-8);cam.setViewOffset(W*K,H*K,0,-H*0.08,W,H)}else{cam.position.set(-10,58,142);cam.lookAt(-10,-6,-8)}

// grain + vignette (2D) supaya terasa hasil kamera
const out=document.createElement('canvas');out.width=W;out.height=H;const o=out.getContext('2d');o.drawImage(r.domElement,0,0);
const vg=o.createRadialGradient(W*.62,H*.5,Math.min(W,H)*.25,W*.55,H*.5,Math.max(W,H)*.75);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(20,12,4,.45)');o.fillStyle=vg;o.fillRect(0,0,W,H);
const id=o.getImageData(0,0,W,H),d=id.data;for(let i=0;i<d.length;i+=4){const n=(Math.random()-.5)*14;d[i]+=n;d[i+1]+=n;d[i+2]+=n}o.putImageData(id,0,0);
out.id='final';document.body.appendChild(out);window.__done=true;
